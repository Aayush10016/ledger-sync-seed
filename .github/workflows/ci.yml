name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      
      - name: Start DynamoDB Local
        run: |
          docker compose up -d dynamodb-local
          echo "Waiting for DynamoDB to become available..."
          for i in {1..30}; do
            if aws dynamodb list-tables --endpoint-url http://localhost:8000 --region us-east-1; then
              echo "DynamoDB is ready!"
              exit 0
            fi
            docker compose logs --tail=20 dynamodb-local
            sleep 2
          done
          echo "DynamoDB failed to start!"
          docker compose logs dynamodb-local
          exit 1
      
      - name: Run unit and integration tests
        run: ./gradlew clean test

      - name: Assert DynamoDB integration tests executed
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          results = pathlib.Path("build/test-results/test")
          total = skipped = failures = errors = 0
          dynamo = None
          for file in results.glob("TEST-*.xml"):
              suite = ET.parse(file).getroot()
              tests = int(suite.attrib.get("tests", 0))
              skips = int(suite.attrib.get("skipped", 0))
              fails = int(suite.attrib.get("failures", 0))
              errs = int(suite.attrib.get("errors", 0))
              total += tests
              skipped += skips
              failures += fails
              errors += errs
              if suite.attrib.get("name", "").endswith("DynamoDbLedgerStoreIntegrationTest"):
                  dynamo = (tests, skips, fails, errs)

          print(f"JUnit summary: tests={total}, skipped={skipped}, failures={failures}, errors={errors}")
          if dynamo is None:
              print("DynamoDbLedgerStoreIntegrationTest did not produce a JUnit result", file=sys.stderr)
              sys.exit(1)
          tests, skips, fails, errs = dynamo
          print(f"DynamoDB integration: tests={tests}, skipped={skips}, failures={fails}, errors={errs}")
          if tests == 0 or skips != 0 or fails != 0 or errs != 0:
              sys.exit(1)
          PY

      - name: Upload JUnit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: build/test-results/test/
          retention-days: 90

      - name: compile and self-check
        run: ./verify.sh

      - name: Run Performance Benchmark
        run: |
          echo "=== Benchmark metadata ===" | tee build/benchmark-output.txt
          echo "Commit SHA: $GITHUB_SHA" | tee -a build/benchmark-output.txt
          echo "Java: $(java -version 2>&1 | head -1)" | tee -a build/benchmark-output.txt
          echo "OS: $(uname -srm)" | tee -a build/benchmark-output.txt
          echo "Dataset: fixtures/corpus-a.jsonl (count=100000 synthetic)" | tee -a build/benchmark-output.txt
          echo "==========================" | tee -a build/benchmark-output.txt
          ./gradlew -q --console=plain runPerf -Pcount=100000 | tee -a build/benchmark-output.txt

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-output
          path: build/benchmark-output.txt
          retention-days: 90

      - name: Stop DynamoDB Local
        if: always()
        run: docker compose down
